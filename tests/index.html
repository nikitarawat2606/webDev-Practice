<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services Hero Section</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <!-- Header / Navbar Section -->
    <header class="navbar">
        <div class="logo">Logo</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </nav>
        <button class="user-btn">Username</button>
    </header>

    <!-- Hero Main Section -->
    <main class="hero-section">
        <!-- Left Text Content -->
        <div class="hero-content">
            <h1>Revitalize Your Clothes with Expert <span class="highlight">Laundry Services!</span></h1>
            <p>From premium dry cleaning to swift wash and fold, we deliver care and convenience. Schedule a pickup and rediscover the freshness of your clothes today!</p>
            <button class="cta-btn">Book a service today!</button>
        </div>

        <!-- Right Video Container using Iframe -->
        <div class="hero-image-container">
            <iframe 
                class="hero-video" 
                src="https://assets.pinterest.com/ext/embed.html?id=99712579247911863" 
                width="450" 
                height="320" 
                scrolling="no"
                title="Laundry Services Video" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </main>
</body>
</html>
